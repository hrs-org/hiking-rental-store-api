name: JMeter Test
run-name: JMeter • threads=${{ inputs.threads || '100' }} ramp=${{ inputs.ramp || '1' }} dur=${{ inputs.duration || '60' }} days=${{ inputs.window_days || '7' }}

on:
    workflow_dispatch:
        inputs:
            threads:
                description: "Number of virtual users"
                required: false
                default: "100"
            ramp:
                description: "Ramp-up in seconds"
                required: false
                default: "1"
            duration:
                description: "Duration in seconds"
                required: false
                default: "60"
            window_days:
                description: "Lookback window in days for startDate"
                required: false
                default: "7"

    schedule:
        - cron: "0 19 * * *"

    push:
        branches: ["develop"]

    pull_request:
        branches: ["develop"]

env:
    JMETER_VERSION: "5.6.3"
    TEST_PLAN: "tests/jmeter/hrs_test.jmx"

    P90_MS: "23000"
    ERR_PCT: "0"

    THREADS: ${{ github.event.inputs.threads     || '100' }}
    RAMP: ${{ github.event.inputs.ramp        || '1'   }}
    DURATION: ${{ github.event.inputs.duration    || '60'  }}
    WINDOW_DAYS: ${{ github.event.inputs.window_days || '7'   }}

jobs:
    jmeter:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        concurrency:
            group: jmeter-${{ github.ref }}
            cancel-in-progress: true

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Java 17
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Install JMeter and tools
              run: |
                  sudo apt-get update -y
                  sudo apt-get install -y jq bc
                  curl -sSL "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz" -o jmeter.tgz
                  tar -xzf jmeter.tgz
                  echo "JMETER_HOME=$PWD/apache-jmeter-${JMETER_VERSION}" >> "$GITHUB_ENV"
                  echo "$PWD/apache-jmeter-${JMETER_VERSION}/bin" >> "$GITHUB_PATH"

            - name: Compute startDate / endDate (UTC ISO-8601)
              run: |
                  END=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
                  START=$(date -u -d "-${WINDOW_DAYS} days" +"%Y-%m-%dT%H:%M:%S.000Z")
                  echo "START_DATE=$START" >> "$GITHUB_ENV"
                  echo "END_DATE=$END" >> "$GITHUB_ENV"
                  echo "Computed window: $START -> $END"

            - name: Run JMeter (non-GUI)
              run: |
                  set -e
                  mkdir -p artifacts
                  BASE="${{ secrets.API_BASE_URL }}"
                  PROTO=$(echo "$BASE" | sed -E 's#^(https?)://.*#\1#')
                  HOST=$(echo "$BASE"  | sed -E 's#^https?://([^/]+)/?.*#\1#')

                  jmeter -n -t "${TEST_PLAN}" \
                    -JbaseUrl="$BASE" \
                    -Jproto="$PROTO" \
                    -Jhost="$HOST" \
                    -Jemail="${{ secrets.JMETER_USER }}" \
                    -Jpassword="${{ secrets.JMETER_PASS }}" \
                    -Jthreads="${THREADS}" \
                    -Jramp="${RAMP}" \
                    -Jduration="${DURATION}" \
                    -JstartDate="${START_DATE}" \
                    -JendDate="${END_DATE}" \
                    -j "artifacts/jmeter.log" \
                    -l "artifacts/results.jtl" \
                    -e -o "artifacts/report"

            - name: Write split summaries (login & get catalog)
              run: |
                  STATS=$(find artifacts/report -type f -name "statistics.json" | head -n1)
                  if [ -z "$STATS" ]; then
                    echo "No statistics.json" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi

                  # 统一入口：items/Items 兼容；overall/Overall 兼容
                  JQ_ITEMS='(.items // .Items // [])'
                  JQ_OVERALL='(.overall // .Overall)'

                  write_one () {
                    local label="$1"
                    local row
                    row=$(jq -r --arg L "$label" "$JQ_ITEMS[] | select(.label==\$L) | \
                          [.label,.sampleCount,.meanResTime,.pct1ResTime,.pct2ResTime,.pct3ResTime,.minResTime,.maxResTime,.errorPct,.throughput] \
                          | @tsv" "$STATS")
                    echo "#### ${label}" >> "$GITHUB_STEP_SUMMARY"
                    if [ -z "$row" ]; then
                      echo "> No data for label: ${label}" >> "$GITHUB_STEP_SUMMARY"
                      echo "" >> "$GITHUB_STEP_SUMMARY"
                      return
                    fi
                    IFS=$'\t' read -r _label samples avg p90 p95 p99 min max err thr <<< "$row"
                    {
                      echo ""
                      echo "| Metric | Value |"
                      echo "|---|---:|"
                      echo "| Samples | $samples |"
                      echo "| Avg (ms) | $avg |"
                      echo "| p90 (ms) | $p90 |"
                      echo "| p95 (ms) | $p95 |"
                      echo "| p99 (ms) | $p99 |"
                      echo "| Min (ms) | $min |"
                      echo "| Max (ms) | $max |"
                      echo "| Error % | $err |"
                      echo "| Throughput (req/s) | $thr |"
                      echo ""
                    } >> "$GITHUB_STEP_SUMMARY"
                  }

                  echo "### JMeter Summary (split by label)" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  write_one "login"
                  write_one "get catalog"

                  # 输出 Overall：若 overall 缺失，用 items 合成
                  synth_overall=$(jq -r '
                    def items: (.items // .Items // []);
                    def tot: (items | map(.sampleCount // 0) | add // 0);
                    if (.overall // .Overall) != null then
                      (.overall // .Overall)
                    else
                      ( items as $it |
                        {
                          sampleCount:  ($it | map(.sampleCount // 0) | add // 0),
                          meanResTime:  ( if (tot>0) then (($it | map((.meanResTime // 0) * (.sampleCount // 0)) | add) / tot) else 0 end ),
                          pct1ResTime:  ($it | map(.pct1ResTime // 0) | max // 0),
                          pct2ResTime:  ($it | map(.pct2ResTime // 0) | max // 0),
                          pct3ResTime:  ($it | map(.pct3ResTime // 0) | max // 0),
                          minResTime:   ($it | map(.minResTime // 0)  | min // 0),
                          maxResTime:   ($it | map(.maxResTime // 0)  | max // 0),
                          errorPct:     ( if (tot>0) then (($it | map((.errorPct // 0) * (.sampleCount // 0)) | add) / tot) else 0 end ),
                          throughput:   ($it | map(.throughput // 0)  | add // 0)
                        })
                    end
                  ' "$STATS")

                  os=$(jq -r '.sampleCount'  <<<"$synth_overall")
                  avg=$(jq -r '.meanResTime'  <<<"$synth_overall")
                  p90=$(jq -r '.pct1ResTime'  <<<"$synth_overall")
                  p95=$(jq -r '.pct2ResTime'  <<<"$synth_overall")
                  p99=$(jq -r '.pct3ResTime'  <<<"$synth_overall")
                  min=$(jq -r '.minResTime'   <<<"$synth_overall")
                  max=$(jq -r '.maxResTime'   <<<"$synth_overall")
                  err=$(jq -r '.errorPct'     <<<"$synth_overall")
                  thr=$(jq -r '.throughput'   <<<"$synth_overall")

                  {
                    echo "#### Overall"
                    echo ""
                    echo "| Metric | Value |"
                    echo "|---|---:|"
                    echo "| Samples | $os |"
                    echo "| Avg (ms) | $avg |"
                    echo "| p90 (ms) | $p90 |"
                    echo "| p95 (ms) | $p95 |"
                    echo "| p99 (ms) | $p99 |"
                    echo "| Min (ms) | $min |"
                    echo "| Max (ms) | $max |"
                    echo "| Error % | $err |"
                    echo "| Throughput (req/s) | $thr |"
                    echo ""
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Print JMeter errors (top)
              if: always()
              run: |
                  echo "---- tail jmeter.log ----"
                  tail -n 200 artifacts/jmeter.log || true
                  echo "---- response code distribution ----"
                  if [ -f artifacts/results.jtl ]; then
                    grep -o 'rc="[0-9]\{3\}"' artifacts/results.jtl | sed 's/rc="//;s/"//' | sort | uniq -c | sort -nr || true
                  fi

            - name: Gate on errors & p90 (overall)
              run: |
                  STATS=$(find artifacts/report -type f -name "statistics.json" | head -n1)
                  if [ -z "$STATS" ]; then
                    echo "::error::statistics.json not found"; ls -R artifacts/report || true; exit 1
                  fi

                  synth_overall=$(jq -r '
                    def items: (.items // .Items // []);
                    def tot: (items | map(.sampleCount // 0) | add // 0);
                    ( .overall // .Overall ) // (
                      items as $it |
                      {
                        sampleCount:  ($it | map(.sampleCount // 0) | add // 0),
                        meanResTime:  ( if (tot>0) then (($it | map((.meanResTime // 0) * (.sampleCount // 0)) | add) / tot) else 0 end ),
                        pct1ResTime:  ($it | map(.pct1ResTime // 0) | max // 0),
                        pct2ResTime:  ($it | map(.pct2ResTime // 0) | max // 0),
                        pct3ResTime:  ($it | map(.pct3ResTime // 0) | max // 0),
                        minResTime:   ($it | map(.minResTime // 0)  | min // 0),
                        maxResTime:   ($it | map(.maxResTime // 0)  | max // 0),
                        errorPct:     ( if (tot>0) then (($it | map((.errorPct // 0) * (.sampleCount // 0)) | add) / tot) else 0 end ),
                        throughput:   ($it | map(.throughput // 0)  | add // 0)
                      }
                    )
                  ' "$STATS")

                  MEAN=$(jq -r '.meanResTime' <<<"$synth_overall")
                  P90=$(jq -r  '.pct1ResTime' <<<"$synth_overall")
                  ERR=$(jq -r  '.errorPct'    <<<"$synth_overall")

                  echo "overall (final): mean=${MEAN} ms, p90=${P90} ms, errors=${ERR}%"

                  if [ -z "$MEAN" ] || [ -z "$P90" ] || [ -z "$ERR" ] || [ "$MEAN" = "null" ] || [ "$P90" = "null" ] || [ "$ERR" = "null" ]; then
                    echo "::error::overall numbers missing"; exit 1
                  fi
                  if [ "$(echo "$ERR > ${ERR_PCT}" | bc -l)" -eq 1 ]; then
                    echo "::error::Overall error percentage ${ERR}% > ${ERR_PCT}%"; exit 1; fi
                  if [ "$(echo "$P90 > ${P90_MS}" | bc -l)" -eq 1 ]; then
                    echo "::error::Overall p90 ${P90}ms > ${P90_MS}ms"; exit 1; fi

            - name: Upload JMeter report & results
              uses: actions/upload-artifact@v4
              with:
                  name: jmeter-report
                  path: artifacts/
                  if-no-files-found: error
